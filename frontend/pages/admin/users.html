<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users — DoEmart Admin</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="logo-text">DoEmart</div><div class="logo-sub">Admin Panel</div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="users.html" class="active">👥 Manage Users</a>
    <a href="shops.html">🏪 Manage Shops</a>
    <a href="orders.html">📦 All Orders</a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user"><div class="avatar" id="avatarInitial">A</div><div class="user-info"><div class="user-name" id="userName">Admin</div><div class="user-role">Administrator</div></div></div>
    <button class="btn btn-ghost btn-sm w-full" id="logoutBtn" style="margin-top:var(--space-3)">Sign Out</button>
  </div>
</aside>
<main class="main-content">
  <div class="topbar animate-fade-in">
    <div><h1 class="page-title">Manage Users</h1><p class="page-subtitle">Review and approve customer registrations</p></div>
    <button class="btn btn-primary" onclick="loadAllUsers()">⟳ Refresh</button>
  </div>
  <div class="table-container animate-slide-up">
    <div class="table-header">
      <span class="table-title">All Customers</span>
      <div class="search-bar" style="width:260px">
        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input class="form-input" type="text" id="userSearch" placeholder="Search users…">
      </div>
    </div>
    <div id="allUsersTable"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>
</main>
<div class="toast-container"></div>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/admin.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (!Auth.requireAuth("../../pages/login.html")) return;
    if (!Auth.requireRole("admin","../../pages/login.html")) return;
    const user = Auth.getUser();
    if (user) { document.getElementById("userName").textContent = user.name; document.getElementById("avatarInitial").textContent = avatarInitials(user.name); }
    document.getElementById("logoutBtn").addEventListener("click", () => { Auth.clear(); window.location.href = "../../pages/login.html"; });
    loadAllUsers();
  });
</script>
</body>
</html>
