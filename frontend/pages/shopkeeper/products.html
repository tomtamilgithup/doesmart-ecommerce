<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Products — DoEmart Shopkeeper</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <style>
    .product-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--space-5);
    }
    .product-card {
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg); overflow: hidden;
      transition: all var(--transition-normal);
    }
    .product-card:hover { border-color: rgba(99,102,241,0.3); transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .product-img {
      width: 100%; height: 160px; object-fit: cover;
      background: var(--navy-700);
    }
    .product-img-placeholder {
      width: 100%; height: 160px;
      background: linear-gradient(135deg, var(--navy-700), var(--navy-600));
      display: flex; align-items: center; justify-content: center; font-size: 48px;
    }
    .product-body { padding: var(--space-4); }
    .product-name { font-size: var(--font-size-base); font-weight: 700; margin-bottom: var(--space-1); }
    .product-price { font-size: var(--font-size-xl); font-weight: 800; color: var(--indigo-400); }
    .product-mrp  { font-size: var(--font-size-xs); color: var(--text-muted); text-decoration: line-through; }
    .product-meta { display: flex; gap: var(--space-2); flex-wrap: wrap; margin: var(--space-3) 0; }
    .product-actions { display: flex; gap: var(--space-2); padding: var(--space-4); border-top: 1px solid var(--glass-border); }

    /* Add product modal */
    .modal { max-width: 640px; }
    .modal .form-stack { gap: var(--space-4); }
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="logo-text">DoEmart</div><div class="logo-sub">My Shop</div></div>
  <nav class="sidebar-nav">
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="products.html" class="active">📦 My Products</a>
    <a href="orders.html">🛒 Incoming Orders</a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user"><div class="avatar" id="avatarInitial">S</div><div class="user-info"><div class="user-name" id="userName">Shopkeeper</div><div class="user-role">Shopkeeper</div></div></div>
    <button class="btn btn-ghost btn-sm w-full" id="logoutBtn" style="margin-top:var(--space-3)">Sign Out</button>
  </div>
</aside>
<main class="main-content">
  <div class="topbar animate-fade-in">
    <div><h1 class="page-title">My Products</h1><p class="page-subtitle">Manage your storefront inventory</p></div>
    <div class="flex gap-3">
      <button class="btn btn-ghost" onclick="loadProducts()">⟳ Refresh</button>
      <button class="btn btn-primary" onclick="openModal('addProductModal')">+ Add Product</button>
    </div>
  </div>

  <div id="productsGrid" class="product-grid animate-slide-up">
    <div class="loading-overlay" style="grid-column:1/-1"><div class="spinner"></div></div>
  </div>
</main>

<!-- Add Product Modal -->
<div class="modal-overlay" id="addProductModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Add New Product</h3>
      <button class="modal-close" data-modal-close>×</button>
    </div>
    <form id="addProductForm" class="form-stack">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Product Name *</label>
          <input class="form-input" name="name" required placeholder="e.g. Basmati Rice 5kg">
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <input class="form-input" name="category" placeholder="e.g. Grocery">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" name="description" rows="2" placeholder="Brief product description…"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Selling Price (₹) *</label>
          <input class="form-input" name="price" type="number" min="0" step="0.01" required placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">MRP (₹)</label>
          <input class="form-input" name="mrp" type="number" min="0" step="0.01" placeholder="0.00">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Quantity in Stock</label>
          <input class="form-input" name="quantity" type="number" min="0" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">Sizes Available</label>
          <input class="form-input" name="sizes_available" placeholder="S,M,L,XL or 500g,1kg">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Offer Label</label>
          <input class="form-input" name="offer_label" placeholder="e.g. 10% OFF">
        </div>
        <div class="form-group">
          <label class="form-label">Discount %</label>
          <input class="form-input" name="offer_percent" type="number" min="0" max="100" placeholder="0">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Product Image</label>
        <label class="upload-trigger" for="productImage">
          <input type="file" id="productImage" name="image" accept="image/*" data-label="productImageLabel">
          <span>🖼️</span>
          <div class="upload-info">
            <div class="name" id="productImageLabel">Upload product photo</div>
            <div class="hint">JPG or PNG · Max 10MB</div>
          </div>
        </label>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="addProductBtn">Add Product</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Product Modal -->
<div class="modal-overlay" id="editProductModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Edit Product</h3>
      <button class="modal-close" data-modal-close>×</button>
    </div>
    <form id="editProductForm" class="form-stack">
      <input type="hidden" id="editProductId" name="_id">
      <div class="form-row">
        <div class="form-group"><label class="form-label">Name</label><input class="form-input" name="name" id="editName"></div>
        <div class="form-group"><label class="form-label">Category</label><input class="form-input" name="category" id="editCategory"></div>
      </div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" name="description" id="editDescription" rows="2"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Price (₹)</label><input class="form-input" name="price" type="number" step="0.01" id="editPrice"></div>
        <div class="form-group"><label class="form-label">MRP (₹)</label><input class="form-input" name="mrp" type="number" step="0.01" id="editMrp"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Quantity</label><input class="form-input" name="quantity" type="number" id="editQuantity"></div>
        <div class="form-group"><label class="form-label">Available</label>
          <select class="form-select" name="is_available" id="editAvailable"><option value="1">Yes</option><option value="0">No</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Sizes</label><input class="form-input" name="sizes_available" id="editSizes"></div>
        <div class="form-group"><label class="form-label">Offer Label</label><input class="form-input" name="offer_label" id="editOfferLabel"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="editProductBtn">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-container"></div>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/shopkeeper.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (!Auth.requireAuth("../../pages/login.html")) return;
    if (!Auth.requireRole("shopkeeper","../../pages/login.html")) return;
    const user = Auth.getUser();
    if (user) { document.getElementById("userName").textContent = user.name; document.getElementById("avatarInitial").textContent = avatarInitials(user.name); }
    document.getElementById("logoutBtn").addEventListener("click", () => { Auth.clear(); window.location.href = "../../pages/login.html"; });

    document.getElementById("productImage").addEventListener("change", function() {
      document.getElementById("productImageLabel").textContent = this.files[0]?.name || "Upload product photo";
    });

    loadProducts();
  });
</script>
</body>
</html>
