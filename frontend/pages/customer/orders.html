<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — DoEmart</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <style>
    .topnav{position:sticky;top:0;z-index:100;background:rgba(10,15,30,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-8);}
    .page-body { padding:var(--space-8); max-width:900px; }

    .order-card {
      background:var(--glass-bg);border:1px solid var(--glass-border);
      border-radius:var(--radius-xl);padding:var(--space-5);
      margin-bottom:var(--space-4);
      transition:all var(--transition-normal);
    }
    .order-card:hover { border-color:rgba(99,102,241,0.25); }
    .order-header { display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3); }
    .order-items { margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--glass-border); }
    .order-item-row { display:flex;justify-content:space-between;font-size:var(--font-size-sm);padding:var(--space-1) 0;color:var(--text-secondary); }
    .order-footer { margin-top:var(--space-4);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3); }
  </style>
</head>
<body>
<nav class="topnav">
  <a href="home.html" class="gradient-text" style="font-size:var(--font-size-xl);font-weight:900">← DoEmart</a>
  <button class="btn btn-ghost btn-sm" id="logoutBtn">Sign Out</button>
</nav>

<div class="page-body">
  <h1 style="margin-bottom:var(--space-6)">📦 My Orders</h1>
  <div id="ordersContainer">
    <div class="loading-overlay"><div class="spinner"></div></div>
  </div>
</div>

<div class="toast-container"></div>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/customer.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (!Auth.requireAuth("../../pages/login.html")) return;
    if (!Auth.requireRole("customer","../../pages/login.html")) return;
    document.getElementById("logoutBtn").addEventListener("click", () => { Auth.clear(); window.location.href = "../../pages/login.html"; });
    loadMyOrders();
  });
</script>
</body>
</html>
