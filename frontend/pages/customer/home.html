<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Shops — DoEmart</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <style>
    body { background: var(--navy-900); }

    /* ── Top nav ── */
    .topnav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,15,30,0.9); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-4) var(--space-8); gap: var(--space-4);
    }
    .topnav-logo { font-size: var(--font-size-xl); font-weight: 900; }
    .topnav-right { display: flex; align-items: center; gap: var(--space-4); }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex; gap: var(--space-3); flex-wrap: wrap;
      padding: var(--space-6) var(--space-8);
      background: var(--navy-950);
      border-bottom: 1px solid var(--glass-border);
    }
    .filter-bar .search-bar { flex: 1; min-width: 200px; }
    .filter-bar .form-input { min-width: 140px; }

    /* ── Page layout ── */
    .page-body { padding: var(--space-8); }

    /* ── Shop grid ── */
    .shops-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--space-6);
    }
    .shop-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      transition: all var(--transition-normal);
      cursor: pointer;
    }
    .shop-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-glow-indigo); border-color: rgba(99,102,241,0.3); }
    .shop-cover {
      height: 120px;
      background: linear-gradient(135deg, var(--navy-700), var(--navy-600));
      display: flex; align-items: center; justify-content: center;
      font-size: 52px; position: relative;
    }
    .shop-logo-img { width: 100%; height: 100%; object-fit: cover; }
    .shop-body { padding: var(--space-5); }
    .shop-name { font-size: var(--font-size-lg); font-weight: 700; margin-bottom: var(--space-2); }
    .shop-meta { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: var(--space-3) 0; }
    .shop-location { font-size: var(--font-size-xs); color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .shop-rating { display: flex; align-items: center; gap: var(--space-2); font-size: var(--font-size-sm); }

    /* ── Cart FAB ── */
    .cart-fab {
      position: fixed; bottom: var(--space-8); right: var(--space-8);
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--indigo-600), var(--indigo-500));
      border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; cursor: pointer;
      box-shadow: 0 8px 30px rgba(99,102,241,0.5);
      transition: all var(--transition-normal);
      border: none; z-index: 50;
    }
    .cart-fab:hover { transform: scale(1.1); box-shadow: 0 12px 40px rgba(99,102,241,0.6); }
    .cart-badge {
      position: absolute; top: -6px; right: -6px;
      background: var(--rose-500); color: #fff;
      width: 22px; height: 22px; border-radius: var(--radius-full);
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    @media (max-width: 640px) {
      .topnav { padding: var(--space-4); }
      .filter-bar { padding: var(--space-4); }
      .page-body { padding: var(--space-4); }
    }
  </style>
</head>
<body>

<!-- ── Top Nav ── -->
<nav class="topnav">
  <div class="topnav-logo gradient-text">DoEmart</div>
  <div class="topnav-right">
    <a href="orders.html" class="btn btn-ghost btn-sm">My Orders</a>
    <div class="sidebar-user" style="background:transparent;border:none;padding:0;gap:var(--space-2)">
      <div class="avatar" id="avatarInitial" style="width:36px;height:36px">C</div>
      <span class="text-sm fw-600" id="userName">Customer</span>
    </div>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Sign Out</button>
  </div>
</nav>

<!-- ── Filter Bar ── -->
<div class="filter-bar">
  <div class="search-bar">
    <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    <input class="form-input" type="text" id="searchInput" placeholder="Search shops or products…">
  </div>
  <input class="form-input" type="text" id="cityInput" placeholder="📍 City">
  <input class="form-input" type="text" id="pincodeInput" placeholder="Pincode" maxlength="6" style="width:120px">
  <select class="form-select" id="categoryFilter" style="width:160px">
    <option value="">All Categories</option>
    <option>Grocery</option><option>Clothing</option><option>Electronics</option>
    <option>Pharmacy</option><option>Bakery</option><option>Stationery</option>
    <option>Hardware</option><option>Vegetables</option><option>Dairy</option><option>General Store</option>
  </select>
  <button class="btn btn-primary" id="searchBtn">Search</button>
  <button class="btn btn-ghost" id="clearBtn">Clear</button>
</div>

<!-- ── Page Body ── -->
<div class="page-body">
  <div class="flex items-center justify-between mb-6">
    <h2 style="font-size:var(--font-size-2xl);font-weight:800">Local Shops Near You</h2>
    <span class="text-muted text-sm" id="shopCount"></span>
  </div>
  <div class="shops-grid" id="shopsGrid">
    <div class="loading-overlay" style="grid-column:1/-1"><div class="spinner"></div><span>Finding shops…</span></div>
  </div>
</div>

<!-- ── Cart FAB ── -->
<button class="cart-fab" id="cartFab" onclick="window.location.href='cart.html'" style="display:none">
  🛒
  <span class="cart-badge" id="cartCount">0</span>
</button>

<div class="toast-container"></div>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/customer.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (!Auth.requireAuth("../../pages/login.html")) return;
    if (!Auth.requireRole("customer","../../pages/login.html")) return;
    const user = Auth.getUser();
    if (user) { document.getElementById("userName").textContent = user.name; document.getElementById("avatarInitial").textContent = avatarInitials(user.name); }
    document.getElementById("logoutBtn").addEventListener("click", () => { Auth.clear(); window.location.href = "../../pages/login.html"; });

    document.getElementById("searchBtn").addEventListener("click", searchShops);
    document.getElementById("clearBtn").addEventListener("click", () => {
      document.getElementById("searchInput").value = "";
      document.getElementById("cityInput").value = "";
      document.getElementById("pincodeInput").value = "";
      document.getElementById("categoryFilter").value = "";
      searchShops();
    });
    ["searchInput","cityInput","pincodeInput"].forEach(id => {
      document.getElementById(id).addEventListener("keydown", e => { if (e.key === "Enter") searchShops(); });
    });

    updateCartBadge();
    searchShops();
  });
</script>
</body>
</html>
