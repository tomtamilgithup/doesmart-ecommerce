<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — DoEmart</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <style>
    .topnav { position:sticky;top:0;z-index:100;background:rgba(10,15,30,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-8);gap:var(--space-4); }
    .topnav-logo { font-size:var(--font-size-xl);font-weight:900; }

    .shop-hero {
      background: linear-gradient(135deg, var(--navy-950), #0d1a3a);
      border-bottom: 1px solid var(--glass-border);
      padding: var(--space-10) var(--space-8);
    }
    .shop-hero-inner { max-width:900px; display:flex; gap:var(--space-6); align-items:center; }
    .shop-avatar {
      width: 100px; height: 100px; border-radius: var(--radius-xl);
      background: linear-gradient(135deg, var(--indigo-600), var(--navy-600));
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; flex-shrink: 0;
      border: 2px solid var(--glass-border);
      overflow: hidden;
    }
    .shop-avatar img { width:100%;height:100%;object-fit:cover; }
    .shop-info h1 { font-size:var(--font-size-3xl); margin-bottom:var(--space-2); }
    .shop-chips { display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-3); }

    .page-body { padding: var(--space-8); max-width: 1100px; }
    .section-title { font-size:var(--font-size-xl);font-weight:800;margin-bottom:var(--space-5); }

    .products-grid {
      display: grid; grid-template-columns: repeat(auto-fill,minmax(240px,1fr));
      gap: var(--space-5);
    }
    .product-card {
      background:var(--glass-bg);border:1px solid var(--glass-border);
      border-radius:var(--radius-lg);overflow:hidden;
      transition:all var(--transition-normal);
    }
    .product-card:hover { transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:rgba(99,102,241,0.25); }
    .product-img-box {
      height:160px;background:linear-gradient(135deg,var(--navy-700),var(--navy-600));
      display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;
    }
    .product-img-box img { width:100%;height:100%;object-fit:cover; }
    .product-body { padding:var(--space-4); }
    .product-name { font-weight:700;margin-bottom:var(--space-2); }
    .product-price { font-size:var(--font-size-xl);font-weight:800;color:var(--indigo-400); }
    .product-actions { padding:var(--space-3) var(--space-4);border-top:1px solid var(--glass-border); }

    .reviews-list { display:flex;flex-direction:column;gap:var(--space-4); }
    .review-item { background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:var(--space-4); }

    .cart-fab { position:fixed;bottom:var(--space-8);right:var(--space-8);width:64px;height:64px;background:linear-gradient(135deg,var(--indigo-600),var(--indigo-500));border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;box-shadow:0 8px 30px rgba(99,102,241,0.5);transition:all var(--transition-normal);border:none;z-index:50; }
    .cart-fab:hover { transform:scale(1.1); }
    .cart-badge { position:absolute;top:-6px;right:-6px;background:var(--rose-500);color:#fff;width:22px;height:22px;border-radius:var(--radius-full);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center; }

    /* Size picker */
    .size-picker { display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-2); }
    .size-btn { padding:4px 12px;border-radius:var(--radius-full);background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text-secondary);font-size:var(--font-size-xs);cursor:pointer;transition:all var(--transition-fast); }
    .size-btn.selected,.size-btn:hover { background:rgba(99,102,241,0.15);border-color:var(--indigo-500);color:var(--indigo-400); }

    /* Review modal */
    .star-select { display:flex;gap:var(--space-2);font-size:28px;cursor:pointer; }
    .star-select .s { color:var(--glass-border);transition:color var(--transition-fast); }
    .star-select .s.on { color:var(--amber-400); }
  </style>
</head>
<body>
<nav class="topnav">
  <a href="home.html" class="topnav-logo gradient-text">← DoEmart</a>
  <div class="flex gap-3 items-center">
    <a href="orders.html" class="btn btn-ghost btn-sm">My Orders</a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Sign Out</button>
  </div>
</nav>

<!-- ── Shop Hero ── -->
<div class="shop-hero" id="shopHero">
  <div class="loading-overlay"><div class="spinner"></div></div>
</div>

<!-- ── Products ── -->
<div class="page-body">
  <div id="productsSection" class="hidden">
    <h3 class="section-title">Available Products</h3>
    <div class="products-grid" id="productsGrid"></div>
  </div>

  <div class="divider" style="margin:var(--space-10) 0"></div>

  <!-- Reviews -->
  <div id="reviewsSection">
    <div class="flex items-center justify-between mb-5">
      <h3 class="section-title" style="margin:0">Customer Reviews</h3>
      <button class="btn btn-ghost btn-sm" onclick="openModal('reviewModal')">+ Write a Review</button>
    </div>
    <div class="reviews-list" id="reviewsList">
      <div class="loading-overlay"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<!-- ── Cart FAB ── -->
<button class="cart-fab" onclick="window.location.href='cart.html'" style="display:none" id="cartFab">
  🛒<span class="cart-badge" id="cartCount">0</span>
</button>

<!-- ── Review Modal ── -->
<div class="modal-overlay" id="reviewModal">
  <div class="modal">
    <div class="modal-header"><h3 class="modal-title">Write a Review</h3><button class="modal-close" data-modal-close>×</button></div>
    <form id="reviewForm">
      <div class="form-group mb-4">
        <label class="form-label">Your Rating *</label>
        <div class="star-select" id="starSelect">
          <span class="s" data-v="1">★</span><span class="s" data-v="2">★</span>
          <span class="s" data-v="3">★</span><span class="s" data-v="4">★</span><span class="s" data-v="5">★</span>
        </div>
        <input type="hidden" id="ratingVal" name="rating" value="0">
      </div>
      <div class="form-group">
        <label class="form-label">Your Review</label>
        <textarea class="form-textarea" name="comment" placeholder="Share your experience…" rows="3"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="reviewSubmitBtn">Submit Review</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-container"></div>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/customer.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (!Auth.requireAuth("../../pages/login.html")) return;
    if (!Auth.requireRole("customer","../../pages/login.html")) return;
    document.getElementById("logoutBtn").addEventListener("click", () => { Auth.clear(); window.location.href = "../../pages/login.html"; });

    // Star rating
    let selectedRating = 0;
    document.querySelectorAll(".star-select .s").forEach(star => {
      star.addEventListener("click", () => {
        selectedRating = parseInt(star.dataset.v);
        document.getElementById("ratingVal").value = selectedRating;
        document.querySelectorAll(".star-select .s").forEach((s,i) => s.classList.toggle("on", i < selectedRating));
      });
      star.addEventListener("mouseenter", () => {
        const v = parseInt(star.dataset.v);
        document.querySelectorAll(".star-select .s").forEach((s,i) => s.classList.toggle("on", i < v));
      });
    });
    document.getElementById("starSelect").addEventListener("mouseleave", () => {
      document.querySelectorAll(".star-select .s").forEach((s,i) => s.classList.toggle("on", i < selectedRating));
    });

    updateCartBadge();
    const sid = new URLSearchParams(window.location.search).get("id");
    if (sid) loadShopDetail(sid);
    else window.location.href = "home.html";
  });
</script>
</body>
</html>
