<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart — DoEmart</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <style>
    .topnav{position:sticky;top:0;z-index:100;background:rgba(10,15,30,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-8);}
    .page-body { padding:var(--space-8); max-width:900px; margin:0 auto; }

    .cart-layout { display:grid;grid-template-columns:1fr 340px;gap:var(--space-6);align-items:start; }

    .cart-item {
      display:flex;align-items:center;gap:var(--space-4);
      padding:var(--space-4) 0;border-bottom:1px solid var(--glass-border);
    }
    .cart-item:last-child { border-bottom:none; }
    .cart-item-img { width:64px;height:64px;border-radius:var(--radius-md);background:var(--navy-700);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px; }
    .cart-item-img img { width:100%;height:100%;object-fit:cover; }
    .cart-item-info { flex:1;min-width:0; }
    .cart-item-name { font-weight:700;margin-bottom:4px; }
    .cart-item-price { color:var(--indigo-400);font-weight:600; }
    .qty-control { display:flex;align-items:center;gap:var(--space-2); }
    .qty-btn { width:28px;height:28px;border-radius:var(--radius-full);background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text-primary);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all var(--transition-fast); }
    .qty-btn:hover { background:var(--indigo-600);border-color:var(--indigo-500); }
    .qty-val { min-width:24px;text-align:center;font-weight:600; }

    .order-summary { background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-xl);padding:var(--space-6); position:sticky;top:80px; }
    .summary-row { display:flex;justify-content:space-between;margin-bottom:var(--space-3);font-size:var(--font-size-sm); }
    .summary-row.total { font-size:var(--font-size-xl);font-weight:800;color:var(--text-primary);margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--glass-border); }

    @media(max-width:768px){.cart-layout{grid-template-columns:1fr;}.order-summary{position:static;}}
  </style>
</head>
<body>
<nav class="topnav">
  <a href="home.html" class="gradient-text" style="font-size:var(--font-size-xl);font-weight:900">← DoEmart</a>
  <div class="flex gap-3">
    <a href="orders.html" class="btn btn-ghost btn-sm">My Orders</a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Sign Out</button>
  </div>
</nav>

<div class="page-body">
  <h1 style="margin-bottom:var(--space-6)">🛒 My Cart</h1>
  <div id="cartContent">
    <div class="loading-overlay"><div class="spinner"></div></div>
  </div>
</div>

<!-- ── Place Order Modal ── -->
<div class="modal-overlay" id="placeOrderModal">
  <div class="modal">
    <div class="modal-header"><h3 class="modal-title">Confirm Order</h3><button class="modal-close" data-modal-close>×</button></div>
    <form id="placeOrderForm" class="form-stack">
      <div class="form-group">
        <label class="form-label">Order Type</label>
        <select class="form-select" name="order_type" id="orderType">
          <option value="spot">Spot Billing (same-day)</option>
          <option value="advance">Advance Order</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Delivery Address</label>
        <textarea class="form-textarea" name="delivery_address" id="deliveryAddress" rows="2" placeholder="Your full delivery address…"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Special Instructions</label>
        <textarea class="form-textarea" name="notes" id="orderNotes" rows="2" placeholder="Any special requests…"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="placeOrderBtn">Place Order</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-container"></div>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/customer.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (!Auth.requireAuth("../../pages/login.html")) return;
    if (!Auth.requireRole("customer","../../pages/login.html")) return;
    document.getElementById("logoutBtn").addEventListener("click", () => { Auth.clear(); window.location.href = "../../pages/login.html"; });
    renderCart();
  });
</script>
</body>
</html>
